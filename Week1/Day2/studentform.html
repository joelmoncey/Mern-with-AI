<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" ">
    <title>Student Enrollment Form</title>
</head>
<body>

    <h1>Student Enrollment Portal</h1>
    <h2>Application Form</h2>
    
    <form >
        
      
        <p>
            <label for="fullName">Full Name *</label><br>
            <input type="text" id="fullName" name="fullName" placeholder="John Doe" ">
        </p>


        <p>
            <label for="email">Email Address *</label><br>
            <input type="email" id="email" name="email" placeholder="mail@gmail.com" >
        </p>


        <p>
            <label for="phone">Phone Number *</label><br>
            <input type="tel" id="phone" name="phone" placeholder="10-digit" >
        </p>

        
        <p>
            <label for="dob">Date of Birth *</label><br>
            <input type="date" id="dob" name="dob" >
        </p>

        
        <p>
            <label for="age">Age * (Must be 16+)</label><br>
            <input type="number" id="age" name="age" min="16" max="100" >
        </p>

        

        
        <p>
            <label>Preferred Shift *</label><br>
            <input type="radio" id="shiftMorning" name="shift" value="morning" required>
            <label for="shiftMorning">Morning</label>
            
            <input type="radio" id="shiftEvening" name="shift" value="evening">
            <label for="shiftEvening">Evening</label>
        </p>

       
    </form>

</body>
</html>
