<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Portfolio</title>
    <style>
        
        body {
            margin: 0;
            padding: 0;
            background: palegreen;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        
        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            text-align: center;
        }

       
        .profile {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            border: 3px solid white;
            margin-bottom: 12px;
        }

        
        .name {
            font-size: 1.5rem;
            font-weight: bold;
            margin: 5px 0;
        }

        .bio {
            font-size: 1rem;
            
            margin-bottom: 30px;
        }

        
        .links {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        
        .button {
            background-color: #ffffff;
            color: #333333;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 600;
            
            box-shadow: 0 4px 6px black;
        }

        
        .button:hover {
            transform: scale(1.02);
            background-color: whitesmoke;
            color: violet;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <img src="" alt="Profile Picture" class="profile">
        <div class="name">Joel Moncey</div>
        <div class="bio">Developer</div>

      
        <div class="links">
            
            <a href="#"  class="button"> Portfolio </a>
            <a href="#"  class="button">GitHub </a>
            <a href="#"  class="button">LinkedIn</a>
            <a href="#"  class="button">Twitter / X</a>
            <a href="#"  class="button">Email</a>
        </div>
    </div>

</body>
</html>
